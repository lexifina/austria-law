name: Current law tooling
on:
  pull_request:
    paths: ['tools/**', 'CURRENT_*.md', '.github/workflows/current-law-tests.yml']
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tools/requirements-current.txt
      - run: python -m unittest discover -s tools -p 'test_catalog.py' -v
      - run: python -m unittest discover -s tools -p 'test_*current.py' -v
